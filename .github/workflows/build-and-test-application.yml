name: Build and test application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: .NET 10
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    timeout-minutes: 15

    steps:
      - name: Check out repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Restore dependencies
        run: dotnet restore dotenv.slnx

      - name: Build
        run: dotnet build dotenv.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test dotenv.slnx --configuration Release --no-build
